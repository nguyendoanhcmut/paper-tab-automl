<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Học Chuyển Giao Liên Nhà Máy Dự Đoán Tắc Nghẽn MBR</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('markmap-theme');
        const theme = (stored === 'dark' || stored === 'light') ? stored : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark', 'markmap-dark');
        } else {
          document.documentElement.classList.remove('dark', 'markmap-dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg-primary: #fafbfc;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --hint-text: #64748b;
      --btn-bg: #ffffff;
      --btn-border: #cbd5e1;
      --btn-text: #334155;
      --btn-hover-bg: #f1f5f9;
      --btn-hover-border: #94a3b8;
      --btn-hover-text: #0f172a;
      --btn-active-bg: #0284c7;
      --btn-active-border: #0284c7;
      --btn-active-text: #ffffff;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

      --markmap-text-color: #0f172a;
      --markmap-circle-open-bg: #ffffff;
      --markmap-code-bg: #f1f5f9;
      --markmap-code-color: #0f172a;
      --markmap-a-color: #0369a1;
      --markmap-a-hover-color: #0284c7;

      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --search-focus-border: #0284c7;
      --search-focus-ring: rgba(2, 132, 199, 0.2);
      --badge-bg: #f1f5f9;
      --badge-text: #475569;
    }

    [data-theme="dark"],
    .dark,
    .markmap-dark {
      --bg-primary: #0b0f19;
      --card-bg: rgba(15, 23, 42, 0.95);
      --border-color: #334155;
      --text-primary: #f8fafc;
      --hint-text: #94a3b8;
      --btn-bg: #1e293b;
      --btn-border: #475569;
      --btn-text: #e2e8f0;
      --btn-hover-bg: #334155;
      --btn-hover-border: #64748b;
      --btn-hover-text: #ffffff;
      --btn-active-bg: #38bdf8;
      --btn-active-border: #38bdf8;
      --btn-active-text: #0b0f19;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);

      --markmap-text-color: #f8fafc;
      --markmap-circle-open-bg: #0b0f19;
      --markmap-code-bg: #1e293b;
      --markmap-code-color: #f8fafc;
      --markmap-a-color: #38bdf8;
      --markmap-a-hover-color: #7dd3fc;

      --search-bg: #1e293b;
      --search-border: #475569;
      --search-focus-border: #38bdf8;
      --search-focus-ring: rgba(56, 189, 248, 0.25);
      --badge-bg: #334155;
      --badge-text: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .markmap {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }
    #markmap-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .markmap, .markmap .katex {
      color: var(--markmap-text-color);
    }
    .markmap .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }
    .markmap .katex {
      white-space: normal;
    }
    .markmap-foreign {
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .toolbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top, 14px));
      right: max(14px, env(safe-area-inset-right, 14px));
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      background: var(--card-bg);
      padding: 5px 8px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .toolbar-divider {
      width: 1px;
      height: 18px;
      background-color: var(--border-color);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .toolbar button, .toolbar select {
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      box-sizing: border-box;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .toolbar button:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
      color: var(--btn-hover-text);
    }
    .toolbar button:active {
      transform: scale(0.96);
    }
    .level-pills {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .level-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--hint-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 3px;
    }
    .btn-level {
      min-width: 28px;
      padding: 0 6px !important;
      font-size: 11px !important;
      font-weight: 600 !important;
    }
    .btn-level.active {
      background: var(--btn-active-bg) !important;
      color: var(--btn-active-text) !important;
      border-color: var(--btn-active-border) !important;
      font-weight: 700 !important;
    }
    .level-select {
      display: none;
      height: 30px;
      font-size: 12px;
      font-weight: 600;
      padding: 0 6px;
      outline: none;
      border-radius: 6px;
    }
    #btn-zoom-out, #btn-zoom-in {
      min-width: 28px;
      font-size: 14px;
      font-weight: 700;
      padding: 0 6px;
    }
    #btn-fit {
      gap: 4px;
    }
    #theme-toggle {
      min-width: 30px;
      padding: 0 7px;
    }
    #theme-toggle svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #theme-toggle .icon-sun {
      display: none;
    }
    #theme-toggle .icon-moon {
      display: block;
    }
    [data-theme="dark"] #theme-toggle .icon-sun,
    .dark #theme-toggle .icon-sun,
    .markmap-dark #theme-toggle .icon-sun {
      display: block;
    }
    [data-theme="dark"] #theme-toggle .icon-moon,
    .dark #theme-toggle .icon-moon,
    .markmap-dark #theme-toggle .icon-moon {
      display: none;
    }

    .search-box {
      display: inline-flex;
      align-items: center;
      position: relative;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 6px;
      height: 30px;
      padding: 0 4px 0 6px;
      gap: 3px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box:focus-within {
      border-color: var(--search-focus-border);
      box-shadow: 0 0 0 2px var(--search-focus-ring);
    }
    .search-icon {
      width: 13px;
      height: 13px;
      stroke: var(--hint-text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      pointer-events: none;
    }
    #search-input {
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      width: 105px;
      outline: none;
      padding: 0 2px;
      transition: width 0.2s ease;
    }
    #search-input::placeholder {
      color: var(--hint-text);
      opacity: 0.8;
    }
    .search-count {
      display: none;
      font-size: 10px;
      font-weight: 600;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      user-select: none;
      line-height: 1.4;
    }
    .search-count.active {
      display: inline-block;
    }
    .search-nav-btn {
      display: none;
      border: none;
      background: transparent;
      color: var(--btn-text);
      cursor: pointer;
      font-size: 9px;
      width: 20px;
      height: 22px;
      border-radius: 4px;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .search-nav-btn:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }
    .search-nav-btn.active {
      display: inline-flex;
    }
    .search-clear-btn {
      font-size: 11px;
      color: var(--hint-text);
    }
    .search-clear-btn:hover {
      color: #ef4444;
    }

    @keyframes markmap-pulse-glow {
      0% {
        filter: drop-shadow(0 0 3px #0284c7) drop-shadow(0 0 7px #38bdf8);
      }
      50% {
        filter: drop-shadow(0 0 10px #0284c7) drop-shadow(0 0 18px #38bdf8);
      }
      100% {
        filter: drop-shadow(0 0 3px #0284c7) drop-shadow(0 0 7px #38bdf8);
      }
    }

    .markmap-node.search-active {
      animation: markmap-pulse-glow 1.4s ease-in-out infinite;
    }
    .markmap-node.search-active circle {
      stroke: #0284c7 !important;
      fill: #f59e0b !important;
      stroke-width: 3px !important;
    }
    .markmap-node.search-active foreignObject,
    .markmap-node.search-active foreignObject > div {
      background: rgba(254, 240, 138, 0.6) !important;
      border-radius: 4px;
      outline: 2px solid #0284c7;
      outline-offset: 1px;
    }
    [data-theme="dark"] .markmap-node.search-active foreignObject,
    [data-theme="dark"] .markmap-node.search-active foreignObject > div,
    .dark .markmap-node.search-active foreignObject,
    .dark .markmap-node.search-active foreignObject > div,
    .markmap-dark .markmap-node.search-active foreignObject,
    .markmap-dark .markmap-node.search-active foreignObject > div {
      background: rgba(234, 179, 8, 0.35) !important;
      outline-color: #38bdf8;
    }
    .markmap-node.search-match:not(.search-active) foreignObject,
    .markmap-node.search-match:not(.search-active) foreignObject > div {
      outline: 1.5px dashed #0284c7;
      border-radius: 4px;
    }
    [data-theme="dark"] .markmap-node.search-match:not(.search-active) foreignObject,
    [data-theme="dark"] .markmap-node.search-match:not(.search-active) foreignObject > div,
    .dark .markmap-node.search-match:not(.search-active) foreignObject,
    .dark .markmap-node.search-match:not(.search-active) foreignObject > div,
    .markmap-dark .markmap-node.search-match:not(.search-active) foreignObject,
    .markmap-dark .markmap-node.search-match:not(.search-active) foreignObject > div {
      outline-color: #38bdf8;
    }

    .title-bar {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      left: max(14px, env(safe-area-inset-left, 14px));
      z-index: 100;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      max-width: 480px;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, padding 0.2s ease;
    }
    .title-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .title-bar h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease;
      flex: 1;
      min-width: 0;
      pointer-events: auto;
    }
    .title-collapse-btn {
      display: none;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--hint-text);
      cursor: pointer;
      font-size: 10px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .title-collapse-btn:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }
    .title-bar p {
      font-size: 11px;
      color: var(--hint-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease;
    }
    .desktop-hint { display: inline; }
    .mobile-hint { display: none; }

    /* Mobile portrait / narrow screens (e.g. phones in portrait <= 640px) */
    @media (max-width: 640px) {
      .toolbar {
        top: max(8px, env(safe-area-inset-top, 8px));
        left: max(8px, env(safe-area-inset-left, 8px));
        right: max(8px, env(safe-area-inset-right, 8px));
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 4px;
        padding: 6px 8px;
        border-radius: 10px;
        box-sizing: border-box;
      }
      .toolbar-zoom-group {
        order: 1;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }
      .toolbar-divider {
        display: none;
      }
      .toolbar-level-group {
        order: 2;
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
      }
      .level-pills {
        display: none;
      }
      .level-select {
        display: inline-flex;
        height: 32px;
        max-width: 96px;
        font-size: 12px;
        font-weight: 600;
        padding: 0 4px;
        border-radius: 6px;
      }
      #theme-toggle {
        order: 3;
        min-width: 36px;
        height: 32px;
        padding: 0 8px;
        margin-left: auto;
        flex-shrink: 0;
      }
      #theme-toggle svg {
        width: 16px;
        height: 16px;
      }
      .search-box {
        order: 4;
        width: 100%;
        flex-basis: 100%;
        height: 36px;
        padding: 0 6px;
        gap: 4px;
        margin-top: 2px;
        box-sizing: border-box;
      }
      .search-icon {
        width: 15px;
        height: 15px;
      }
      #search-input {
        flex: 1;
        min-width: 50px;
        width: 100%;
        font-size: 16px; /* 16px prevents iOS Safari from auto-zooming viewport on focus */
      }
      .search-box:focus-within #search-input {
        width: 100%;
      }
      .search-count {
        font-size: 11px;
        padding: 2px 5px;
      }
      .search-nav-btn {
        min-width: 28px;
        height: 28px;
        font-size: 12px;
      }
      .search-clear-btn {
        font-size: 14px;
      }
      .toolbar button {
        height: 32px;
        font-size: 12px;
      }
      #btn-fit {
        min-width: 32px;
        padding: 0 6px;
      }
      #btn-fit .btn-text {
        display: none; /* Icon only to prevent Row 1 overflow on narrow screens */
      }
      #btn-zoom-out, #btn-zoom-in {
        min-width: 30px;
        font-size: 16px;
        padding: 0 4px;
      }
      .title-bar {
        bottom: max(8px, env(safe-area-inset-bottom, 8px));
        left: max(8px, env(safe-area-inset-left, 8px));
        right: max(8px, env(safe-area-inset-right, 8px));
        max-width: calc(100vw - 16px);
        padding: 6px 10px;
        border-radius: 6px;
        transition: opacity 0.2s ease, background-color 0.25s ease, border-color 0.25s ease;
      }
      .title-collapse-btn {
        display: inline-flex;
      }
      .title-bar.collapsed {
        padding: 4px 8px;
      }
      .title-bar.collapsed p {
        display: none !important;
      }
      .title-bar.collapsed h1 {
        margin-bottom: 0;
      }
      .title-bar.search-focused {
        opacity: 0.15;
        pointer-events: none;
      }
      .title-bar h1 {
        font-size: 12px;
        margin-bottom: 1px;
      }
      .title-bar p {
        font-size: 10px;
      }
      .desktop-hint { display: none; }
      .mobile-hint { display: inline; }
    }

    /* Mobile landscape (e.g. phones rotated horizontally) */
    @media (orientation: landscape) and (max-height: 600px) {
      .toolbar {
        top: max(6px, env(safe-area-inset-top, 6px));
        right: max(6px, env(safe-area-inset-right, 6px));
        left: auto;
        width: auto;
        display: inline-flex;
        flex-wrap: nowrap;
        gap: 3px;
        padding: 3px 6px;
        border-radius: 8px;
        max-width: calc(100vw - 12px);
      }
      .toolbar-divider {
        display: inline-block;
        margin: 0 1px;
        height: 16px;
      }
      .toolbar button, .toolbar select {
        height: 28px;
        font-size: 11px;
      }
      #btn-fit .btn-text {
        display: none;
      }
      #btn-fit {
        min-width: 26px;
        padding: 0 4px;
      }
      #btn-zoom-out, #btn-zoom-in {
        min-width: 24px;
        font-size: 14px;
        padding: 0 2px;
      }
      .level-pills {
        display: none;
      }
      .level-select {
        display: inline-flex;
        height: 28px;
        font-size: 11px;
        padding: 0 2px;
        max-width: 90px;
      }
      .search-box {
        order: unset;
        width: auto;
        flex-basis: auto;
        height: 28px;
        padding: 0 3px 0 4px;
        gap: 2px;
        margin-top: 0;
      }
      #search-input {
        width: 80px;
        font-size: 12px;
      }
      .search-box:focus-within #search-input {
        width: 120px;
      }
      .search-count {
        font-size: 9px;
        padding: 1px 3px;
      }
      .search-nav-btn {
        width: 20px;
        height: 22px;
        font-size: 10px;
      }
      .search-clear-btn {
        font-size: 12px;
      }
      #theme-toggle {
        order: unset;
        margin-left: 0;
        min-width: 28px;
        height: 28px;
        padding: 0 5px;
      }
      #theme-toggle svg {
        width: 14px;
        height: 14px;
      }
      .title-bar {
        bottom: max(6px, env(safe-area-inset-bottom, 6px));
        left: max(6px, env(safe-area-inset-left, 6px));
        max-width: 320px;
        padding: 4px 8px;
      }
      .title-bar h1 { font-size: 11px; }
      .title-bar p { display: none; }
    }
  </style>
</head>
<body>

  <div class="toolbar" role="toolbar" aria-label="Mind map controls">
    <div class="toolbar-group toolbar-zoom-group">
      <button id="btn-fit" aria-label="Fit view" title="Fit to view (F)" onclick="window.mm && window.mm.fit()">
        <span class="btn-icon">⊞</span><span class="btn-text"> Fit</span>
      </button>
      <button id="btn-zoom-out" aria-label="Zoom out" title="Zoom out (−)" onclick="window.mm && window.mm.rescale(0.8)">−</button>
      <button id="btn-zoom-in" aria-label="Zoom in" title="Zoom in (+)" onclick="window.mm && window.mm.rescale(1.25)">+</button>
    </div>

    <div class="toolbar-divider" aria-hidden="true"></div>

    <div class="toolbar-group toolbar-level-group">
      <div class="level-pills" role="group" aria-label="Expand level">
        <span class="level-label">Lv</span>
        <button type="button" class="btn-level" data-level="1" title="Level 1: Root only" onclick="window.__setLevel(1)">L1</button>
        <button type="button" class="btn-level active" data-level="2" title="Level 2: Chapters" onclick="window.__setLevel(2)">L2</button>
        <button type="button" class="btn-level" data-level="3" title="Level 3: Sections" onclick="window.__setLevel(3)">L3</button>
        <button type="button" class="btn-level" data-level="4" title="Level 4: Subsections" onclick="window.__setLevel(4)">L4</button>
        <button type="button" class="btn-level" data-level="5" title="Level 5: Details" onclick="window.__setLevel(5)">L5</button>
      </div>
      <select id="level-select" class="level-select" aria-label="Expand level" onchange="window.__setLevel(this.value)">

  <script>
    const lightPalette = ['#0369a1', '#c2410c', '#15803d', '#b91c1c', '#7e22ce', '#be185d', '#0f766e', '#a16207', '#6d28d9', '#047857'];
    const darkPalette = ['#38bdf8', '#fb923c', '#4ade80', '#f87171', '#c084fc', '#f472b6', '#2dd4bf', '#facc15', '#a78bfa', '#34d399'];

    // Clean ES6 Map color assignment with path hashing
    const colorCache = new Map();
    function createColorFunction(theme) {
      const palette = theme === 'dark' ? darkPalette : lightPalette;
      return function(node) {
        let p = typeof node === 'string' ? node : ((node && node.state && node.state.path) || '');
        if (p) {
          const parts = p.split('.');
          p = parts.slice(0, 2).join('.');
        }
        const key = theme + ':' + p;
        if (colorCache.has(key)) return colorCache.get(key);

        let h = 0;
        for (let i = 0; i < p.length; i++) {
          h = ((h << 5) - h) + p.charCodeAt(i);
          h |= 0;
        }
        const color = palette[Math.abs(h) % palette.length];
        colorCache.set(key, color);
        return color;
      };
    }

    function applyTheme(theme, persist) {
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark', 'markmap-dark');
      } else {
        document.documentElement.classList.remove('dark', 'markmap-dark');
      }
      if (persist) {
        try {
          localStorage.setItem('markmap-theme', theme);
        } catch (e) {}
      }
      if (window.mm) {
        const colorFn = createColorFunction(theme);
        window.mm.setOptions({
          color: (node) => colorFn(node)
        });
        window.mm.renderData();
      }
    }

    window.__toggleTheme = function() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    };

    let updateHighlightClasses = function() {};

    let isUpdatingLevel = false;
    window.__setLevel = async function(lvl) {
      if (isUpdatingLevel || !window.mm || !window.mm.state || !window.mm.state.data) return;
      const targetLevel = parseInt(lvl, 10);
      if (isNaN(targetLevel) || targetLevel < 1 || targetLevel > 10) return;
      isUpdatingLevel = true;
      try {
        // Update button pills active state
        document.querySelectorAll('.btn-level').forEach(btn => {
          const btnLvl = parseInt(btn.getAttribute('data-level'), 10);
          if (btnLvl === targetLevel) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Update dropdown state
        const selectEl = document.getElementById('level-select');
        if (selectEl) {
          selectEl.value = String(targetLevel);
        }

        const root = window.mm.state.data;
        function applyFold(node, currentDepth) {
          const shouldFold = currentDepth >= targetLevel;
          if (!node.payload) {
            if (shouldFold) node.payload = { fold: 1 };
          } else {
            node.payload.fold = shouldFold ? 1 : 0;
          }
          if (node.children && node.children.length) {
            for (let i = 0; i < node.children.length; i++) {
              applyFold(node.children[i], currentDepth + 1);
            }
          }
        }
        applyFold(root, 1);

        await window.mm.renderData();
        await window.mm.fit();
        if (typeof updateHighlightClasses === 'function') {
          updateHighlightClasses();
        }
      } catch (err) {
        console.error('Failed to set level:', err);
      } finally {
        isUpdatingLevel = false;
      }
    };

    try {
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('markmap-theme')) {
            applyTheme(e.matches ? 'dark' : 'light', false);
          }
        });
      }
    } catch (e) {}

    // High-performance tree initialization eliminating string hashing bottleneck
    if (window.markmap && window.markmap.Markmap) {
      window.markmap.Markmap.prototype._initializeData = function(node) {
        let nodeId = 0;
        const { color, initialExpandLevel } = this.options;
        let foldRecursively = 0;
        let depth = 0;
        function walk(item, parent) {
          depth++;
          nodeId++;
          const sId = nodeId;
          const sPath = parent && parent.state && parent.state.path ? parent.state.path + '.' + sId : '' + sId;
          item.state = {
            depth,
            id: sId,
            key: (parent && parent.state ? parent.state.id + '.' : '') + sId,
            path: sPath,
            rect: { x: 0, y: 0, width: 0, height: 0 },
            size: [0, 0]
          };
          color(item);
          const isFoldRecursively = item.payload && item.payload.fold === 2;
          if (isFoldRecursively) {
            foldRecursively++;
          } else if (foldRecursively || (initialExpandLevel >= 0 && depth >= initialExpandLevel)) {
            if (!item.payload) item.payload = { fold: 1 };
            else item.payload.fold = 1;
          }
          if (item.children && item.children.length) {
            for (let i = 0; i < item.children.length; i++) {
              walk(item.children[i], item);
            }
          }
          if (isFoldRecursively) foldRecursively--;
          depth--;
        }
        walk(node, null);
        return node;
      };
    }

    (async function init() {
      const dataEl = document.getElementById('mindmap-data');
      let raw = dataEl ? dataEl.textContent.trim() : '';
      if (dataEl) dataEl.textContent = ''; // Free memory immediately

      let rootData;
      if (!raw || raw.includes('{MINDMAP_' + 'DATA}')) {
        rootData = {
          content: 'Interactive Mind Map',
          children: [
            { content: 'Overview', children: [{ content: 'Key concepts' }] },
            { content: 'Details', children: [{ content: 'Deep dive' }] }
          ]
        };
      } else if (raw.startsWith('{') || raw.startsWith('[')) {
        rootData = JSON.parse(raw);
      } else {
        // High-speed native streaming decompression
        const bytes = Uint8Array.fromBase64 ? Uint8Array.fromBase64(raw) : Uint8Array.from(atob(raw), c => c.charCodeAt(0));
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        rootData = await new Response(ds.readable).json();
      }

      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const colorFn = createColorFunction(currentTheme);

      const isMobile = window.innerWidth < 640;
      const responsiveMaxWidth = Math.min(420, Math.max(260, window.innerWidth - 48));
      const responsiveSpacingH = isMobile ? 48 : 80;

      const svg = document.getElementById('markmap-svg');
      window.mm = markmap.Markmap.create(svg, {
        initialExpandLevel: 2,
        maxWidth: responsiveMaxWidth,
        colorFreezeLevel: 2,
        duration: 200,
        spacingHorizontal: responsiveSpacingH,
        spacingVertical: 8,
        color: (node) => colorFn(node)
      }, rootData);

      svg.addEventListener('click', (e) => {
        if (e.target.tagName === 'circle') {
          // Manual node toggle occurred: clear pills active state and mark select as custom
          document.querySelectorAll('.btn-level').forEach(btn => btn.classList.remove('active'));
          const selectEl = document.getElementById('level-select');
          if (selectEl) selectEl.value = 'custom';
          setTimeout(updateHighlightClasses, 250);
        }
      });

      // ==========================================
      // High-Performance Real-Time Search Engine (< 10ms)
      // ==========================================
      let searchMatches = [];
      let currentSearchIndex = -1;
      let searchDebounceTimer = null;
      const flatSearchIndex = [];

      function decodeHtmlEntities(str) {
        if (!str) return '';
        return str
          .replace(/&#x([0-9a-fA-F]+);/g, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
          .replace(/&#([0-9]+);/g, (_, dec) => String.fromCodePoint(parseInt(dec, 10)))
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&apos;/g, "'")
          .replace(/&nbsp;/g, ' ');
      }

      function cleanTextForSearch(str) {
        if (!str) return '';
        // Strip MathML elements to eliminate duplicate LaTeX/MathML tokens
        const withoutMathml = str.replace(/<span class="katex-mathml">[\s\S]*?<\/span>/gi, ' ');
        return decodeHtmlEntities(withoutMathml.replace(/<[^>]*>/g, ' '))
          .replace(/[\u2018\u2019]/g, "'")
          .replace(/[\u201C\u201D]/g, '"')
          .replace(/[\u2013\u2014]/g, '-')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function removeAccents(str) {
        if (!str) return '';
        return str
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/g, 'd')
          .replace(/Đ/g, 'D');
      }

      function preIndexAndFlattenSearch(node, ancestors) {
        if (!node) return;
        const text = cleanTextForSearch(node.content);
        node._textLower = text.toLowerCase();
        node._textNorm = removeAccents(node._textLower);
        flatSearchIndex.push({ node, ancestors });
        if (node.children && node.children.length) {
          const nextAncestors = ancestors.concat(node);
          for (let i = 0; i < node.children.length; i++) {
            preIndexAndFlattenSearch(node.children[i], nextAncestors);
          }
        }
      }
      preIndexAndFlattenSearch(rootData, []);

      updateHighlightClasses = function() {
        const svg = document.getElementById('markmap-svg');
        if (!svg) return;
        svg.querySelectorAll('.search-active').forEach(el => el.classList.remove('search-active'));
        svg.querySelectorAll('.search-match').forEach(el => el.classList.remove('search-match'));

        if (searchMatches.length === 0 || currentSearchIndex < 0) return;

        const renderedMap = new Map();
        svg.querySelectorAll('g.markmap-node').forEach(g => {
          const path = g.getAttribute('data-path');
          if (path) renderedMap.set(path, g);
        });

        for (let i = 0; i < searchMatches.length; i++) {
          const m = searchMatches[i];
          const path = m.node && m.node.state && m.node.state.path;
          const gNode = path ? renderedMap.get(path) : null;
          if (gNode) {
            if (i === currentSearchIndex) {
              gNode.classList.add('search-active');
            } else {
              gNode.classList.add('search-match');
            }
          }
        }
      };

      async function zoomToNode(node) {
        if (!window.mm || !node) return;
        const elem = window.mm.findElement(node);
        const itemData = elem ? elem.data : node;
        if (!itemData || !itemData.state || !itemData.state.rect) return;

        const svgNode = window.mm.svg.node();
        const relRect = svgNode.getBoundingClientRect();
        const curTransform = d3.zoomTransform(svgNode);

        const minScale = window.innerWidth < 640 ? 0.85 : 1.0;
        const k = Math.max(curTransform.k, minScale);

        const cx = relRect.width / 2;
        const cy = relRect.height / 2;
        const x0 = itemData.state.rect.x + itemData.state.rect.width / 2;
        const y0 = itemData.state.rect.y + itemData.state.rect.height / 2;

        const targetTransform = d3.zoomIdentity
          .translate(cx - x0 * k, cy - y0 * k)
          .scale(k);

        await window.mm.transition(window.mm.svg).call(window.mm.zoom.transform, targetTransform).end().catch(() => {});
      }

      async function activateSearchMatch(index) {
        if (index < 0 || index >= searchMatches.length) return;
        currentSearchIndex = index;

        const countEl = document.getElementById('search-count');
        if (countEl) {
          countEl.textContent = (index + 1) + '/' + searchMatches.length;
          countEl.classList.add('active');
        }

        const match = searchMatches[index];
        let needsRender = false;
        if (match.ancestors && match.ancestors.length) {
          for (let i = 0; i < match.ancestors.length; i++) {
            const a = match.ancestors[i];
            if (a.payload && a.payload.fold) {
              a.payload.fold = 0;
              needsRender = true;
            }
          }
        }

        if (needsRender) {
          document.querySelectorAll('.btn-level').forEach(btn => btn.classList.remove('active'));
          const selectEl = document.getElementById('level-select');
          if (selectEl) selectEl.value = 'custom';
          await window.mm.renderData();
        }

        updateHighlightClasses();
        await zoomToNode(match.node);
      }

      function clearSearch() {
        searchMatches = [];
        currentSearchIndex = -1;
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.value = '';
        const countEl = document.getElementById('search-count');
        if (countEl) {
          countEl.textContent = '';
          countEl.classList.remove('active');
        }
        const prevBtn = document.getElementById('btn-search-prev');
        if (prevBtn) prevBtn.classList.remove('active');
        const nextBtn = document.getElementById('btn-search-next');
        if (nextBtn) nextBtn.classList.remove('active');
        const clearBtn = document.getElementById('btn-search-clear');
        if (clearBtn) clearBtn.classList.remove('active');

        updateHighlightClasses();
      }

      async function executeSearch(query) {
        if (!window.mm || !window.mm.state || !window.mm.state.data) return;
        const q = (query || '').trim();
        if (!q) {
          clearSearch();
          return;
        }

        const qLower = q.toLowerCase();
        const qNorm = removeAccents(qLower);

        const matches = [];
        const total = flatSearchIndex.length;
        for (let i = 0; i < total; i++) {
          const item = flatSearchIndex[i];
          const n = item.node;
          if (n._textLower.includes(qLower) || n._textNorm.includes(qNorm)) {
            matches.push(item);
          }
        }
        searchMatches = matches;

        const countEl = document.getElementById('search-count');
        const prevBtn = document.getElementById('btn-search-prev');
        const nextBtn = document.getElementById('btn-search-next');
        const clearBtn = document.getElementById('btn-search-clear');

        if (clearBtn) clearBtn.classList.add('active');

        if (matches.length === 0) {
          currentSearchIndex = -1;
          if (countEl) {
            countEl.textContent = '0/0';
            countEl.classList.add('active');
          }
          if (prevBtn) prevBtn.classList.remove('active');
          if (nextBtn) nextBtn.classList.remove('active');
          updateHighlightClasses();
          return;
        }

        if (prevBtn) prevBtn.classList.add('active');
        if (nextBtn) nextBtn.classList.add('active');

        await activateSearchMatch(0);
      }

      async function nextSearchMatch() {
        if (searchMatches.length === 0) return;
        const nextIdx = (currentSearchIndex + 1) % searchMatches.length;
        await activateSearchMatch(nextIdx);
      }

      async function prevSearchMatch() {
        if (searchMatches.length === 0) return;
        const prevIdx = (currentSearchIndex - 1 + searchMatches.length) % searchMatches.length;
        await activateSearchMatch(prevIdx);
      }

      const searchInput = document.getElementById('search-input');
      const prevBtn = document.getElementById('btn-search-prev');
      const nextBtn = document.getElementById('btn-search-next');
      const clearBtn = document.getElementById('btn-search-clear');

      // Prevent input blur when tapping search navigation buttons on touch screens
      [prevBtn, nextBtn, clearBtn].forEach(btn => {
        if (btn) {
          btn.addEventListener('pointerdown', (e) => e.preventDefault());
          btn.addEventListener('mousedown', (e) => e.preventDefault());
        }
      });

      if (searchInput) {
        const titleBarEl = document.getElementById('title-bar');
        searchInput.addEventListener('focus', () => {
          if (titleBarEl) titleBarEl.classList.add('search-focused');
        });
        searchInput.addEventListener('blur', () => {
          if (titleBarEl) titleBarEl.classList.remove('search-focused');
        });

        searchInput.addEventListener('input', (e) => {
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            executeSearch(e.target.value);
          }, 10);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (e.shiftKey) {
              prevSearchMatch();
            } else {
              nextSearchMatch();
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            nextSearchMatch();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            prevSearchMatch();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            clearSearch();
            searchInput.blur();
          }
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', (e) => {
          e.preventDefault();
          prevSearchMatch();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          nextSearchMatch();
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          clearSearch();
        });
      }

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(async () => {
          if (window.mm) {
            const isMob = window.innerWidth < 640;
            const newMaxWidth = Math.min(420, Math.max(260, window.innerWidth - 48));
            window.mm.setOptions({
              maxWidth: newMaxWidth,
              spacingHorizontal: isMob ? 48 : 80
            });
            await window.mm.renderData();
            await window.mm.fit();
            if (typeof updateHighlightClasses === 'function') {
              updateHighlightClasses();
            }
          }
        }, 150);
      });

      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
        if (e.key === '/') {
          e.preventDefault();
          const si = document.getElementById('search-input');
          if (si) {
            si.focus();
            si.select();
          }
          return;
        }
        if (e.key === 'Escape') {
          clearSearch();
          return;
        }
        if (e.key === '1') window.__setLevel(1);
        else if (e.key === '2') window.__setLevel(2);
        else if (e.key === '3') window.__setLevel(3);
        else if (e.key === '4') window.__setLevel(4);
        else if (e.key === '5') window.__setLevel(5);
        else if (e.key === 'f' || e.key === 'F') { if (window.mm) window.mm.fit(); }
        else if (e.key === '+' || e.key === '=') { if (window.mm) window.mm.rescale(1.25); }
        else if (e.key === '-' || e.key === '_') { if (window.mm) window.mm.rescale(0.8); }
        else if (e.key === 't' || e.key === 'T') { if (window.__toggleTheme) window.__toggleTheme(); }
      });
    })();
  </script>
</body>
</html>
